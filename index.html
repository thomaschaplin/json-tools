<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="author" content="Thomas Chaplin">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <!--seo:head-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="JSON Tools">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Apply the saved theme before first paint so the page never flashes. -->
    <script>
      (function () {
        var t = "system";
        try {
          var s = JSON.parse(localStorage.getItem("jt.settings.v2") || "{}");
          if (s.theme === "light" || s.theme === "dark") t = s.theme;
        } catch (e) {}
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#about">Skip to description</a>
    <div id="app" class="app">
      <noscript>
        <div class="noscript">JSON Tools runs entirely in your browser and needs JavaScript enabled.</div>
      </noscript>
    </div>
    <!--seo:about-->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
